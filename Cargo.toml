[package]
name = "splendor"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8.8", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
image = "0.25"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
# ort = "2.0" # ONNX Runtime for ML inference - commented out to avoid heavy build during task
